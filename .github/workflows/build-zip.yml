name: Build CoinScaner 1.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'CoinScaner_v1.1_source.zip'
      - '.github/workflows/build-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

            - name: Extract and fix CoinScaner source
        run: |
          unzip -q CoinScaner_v1.1_source.zip -d /tmp/coinscaner
          cp -a /tmp/coinscaner/coinscaner_work/. .
          sed -i 's/private lateinit var scanButton$/private lateinit var scanButton: Button/' app/src/main/java/com/coinscaner/app/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: CoinScaner-1.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
