name: Build Binance Scanner APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project archive
  shell: bash
  run: |
  set -euo pipefail
  
      mkdir -p source

    echo "=== ZIP archives found in repository ==="
    find . -maxdepth 5 -type f -iname "*.zip" -print

    ARCHIVE="$(find . -maxdepth 5 -type f -iname "*CoinScanner*source*.zip" -print -quit)"

    if [ -z "$ARCHIVE" ]; then
      echo "ERROR: Coin Scanner source archive not found."
      echo "Available ZIP files:"
      find . -maxdepth 5 -type f -iname "*.zip" -print
      exit 1
    fi

    echo "=== Selected archive: $ARCHIVE ==="
    unzip -o "$ARCHIVE" -d source

    echo "=== Android Gradle project files ==="
    find source -type f -name settings.gradle.kts -o -name build.gradle.kts -print

    if ! find source -type f -name settings.gradle.kts -print -quit | grep -q .; then
      echo "ERROR: settings.gradle.kts not found after extraction."
      exit 1
    fi

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle.kts -print -quit)")
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BinanceCoinScannerPRO-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
